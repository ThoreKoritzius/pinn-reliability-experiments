name: Scientific checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python export_explorer.py --standalone --resolution 12 --frames 3 --out results/test-demo.html
      - run: node validate_explorer.cjs results/explorer-data.html
      - run: node validate_standalone.cjs
